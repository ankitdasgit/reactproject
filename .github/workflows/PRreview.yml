name: PR Review (Terraform)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔹 Get clean Terraform diff
      - name: Get Terraform Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} \
            | grep -E "\.tf" \
            | head -c 20000 > pr.diff

      # 🔹 Install tools
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      # 🔹 Run tfsec (Security)
      - name: Run tfsec
        run: |
          docker run --rm -v $(pwd):/src aquasec/tfsec /src --format json > tfsec.json
        continue-on-error: true

      # 🔹 Run tflint (Best practices)
      - name: Run tflint
        run: |
          tflint --format json > tflint.json || true

      # 🔹 Prepare report
      - name: Prepare Report
        run: |
          echo "## 🔐 Security Issues (tfsec)" > report.txt

          if [ -s tfsec.json ]; then
            jq -r '.results[] | "- [" + .severity + "] " + .description + " (" + .location.filename + ")"' tfsec.json >> report.txt
          else
            echo "No security issues found" >> report.txt
          fi

          echo "\n## 🏗 Terraform Best Practices (tflint)" >> report.txt

          if [ -s tflint.json ]; then
            jq -r '.issues[] | "- [" + .rule + "] " + .message' tflint.json >> report.txt
          else
            echo "No lint issues found" >> report.txt
          fi

      # 🔹 Comment on PR
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const diff = fs.readFileSync('pr.diff', 'utf8').slice(0, 60000);
            const report = fs.readFileSync('report.txt', 'utf8');

            const body =
              "## 🔍 Terraform Changes\n" +
              "```diff\n" +
              diff +
              "\n```\n\n" +
              report;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });