name: PR Review (React Advanced)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      # 🔹 Diff
      - name: Get Code Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} \
            | grep -E "\.js|\.jsx|\.ts|\.tsx" \
            | head -c 20000 > pr.diff

      # 🔹 ESLint
      - name: Run ESLint
        run: npx eslint . -f json > eslint.json || true

      # 🔹 Security
      - name: npm audit
        run: npm audit --json > audit.json || true

      # 🔹 Tests
      - name: Run Tests
        run: npm test || true

      # 🔹 Build
      - name: Build
        run: npm run build || echo "fail" > build.txt

      # 🔹 Prepare report
      - name: Prepare Report
        run: |
          echo "## 🧹 ESLint" > report.txt
          jq -r '.[]?.messages[]? | "- " + .message' eslint.json >> report.txt || echo "No issues" >> report.txt

          echo "\n## 🔐 Security" >> report.txt
          jq -r '.vulnerabilities | to_entries[] | "- [" + .value.severity + "] " + .key' audit.json >> report.txt || echo "No issues" >> report.txt

          echo "\n## 🏗 Build" >> report.txt
          if [ -f build.txt ]; then echo "❌ Build failed" >> report.txt; else echo "✅ Build passed" >> report.txt; fi

      # 🔹 Comment
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const diff = fs.readFileSync('pr.diff', 'utf8').slice(0,60000);
            const report = fs.readFileSync('report.txt','utf8');

            const body =
              "## 🔍 Changes\n```diff\n" + diff + "\n```\n\n" + report;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });


