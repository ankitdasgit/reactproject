name: PR Review (React Clean)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Checkout
      - uses: actions/checkout@v4

      # 🔹 Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔹 Install deps
      - name: Install Dependencies
        run: npm install

      # 🔹 Get diff (only JS/TS files)
      - name: Get Code Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} \
            | grep -E "\.js|\.jsx|\.ts|\.tsx" \
            | head -c 20000 > pr.diff

      # 🔹 ESLint
      - name: Run ESLint
        run: npx eslint . -f json > eslint.json || true

      # 🔹 Security audit
      - name: Run npm audit
        run: npm audit --json > audit.json || true

      # 🔹 Build check
      - name: Build
        run: npm run build || echo "fail" > build.txt

      # 🔥 Prepare CLEAN report (IMPORTANT FIX)
      - name: Prepare Report
        run: |
          echo "## 🧹 ESLint Issues" > report.txt

          jq -r '
          .[]?.messages[]? |
          "- " + .message
          ' eslint.json >> report.txt 2>/dev/null || echo "No issues" >> report.txt

          echo "\n## 🔐 Security Summary" >> report.txt

          echo "\n### 🚨 Critical Issues" >> report.txt
          jq -r '
          .vulnerabilities | to_entries[] 
          | select(.value.severity=="critical") 
          | "- " + .key
          ' audit.json >> report.txt 2>/dev/null || echo "None" >> report.txt

          echo "\n### ⚠️ High Issues" >> report.txt
          jq -r '
          .vulnerabilities | to_entries[] 
          | select(.value.severity=="high") 
          | "- " + .key
          ' audit.json >> report.txt 2>/dev/null || echo "None" >> report.txt

          echo "\n## 🏗 Build Status" >> report.txt
          if [ -f build.txt ]; then
            echo "❌ Build failed" >> report.txt
          else
            echo "✅ Build successful" >> report.txt
          fi

      # 🔹 Comment on PR (CLEAN OUTPUT)
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const diff = fs.readFileSync('pr.diff', 'utf8').slice(0, 60000);
            const report = fs.readFileSync('report.txt', 'utf8');

            const body =
              "## 🔍 Code Changes\n" +
              "```diff\n" +
              diff +
              "\n```\n\n" +
              report;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            


