name: PR Review (React Clean Final)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔹 Install deps
      - name: Install Dependencies
        run: npm install

      # 🔹 Get diff (only code files)
      - name: Get Code Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} \
            | grep -E "\.js|\.jsx|\.ts|\.tsx" \
            | head -c 20000 > pr.diff

      # 🔹 ESLint (only errors)
      - name: Run ESLint
        run: npx eslint . -f json > eslint.json || true

      # 🔹 Security (filtered)
      - name: Run npm audit
        run: npm audit --json > audit.json || true

      # 🔹 Build (ignore warnings)
      - name: Build
        run: npm run build > build.log 2>&1 || echo "fail" > build.txt

      # 🔥 CLEAN REPORT (FIXED PROPERLY)
      - name: Prepare Clean Report
        run: |
          echo "## 🧹 Code Issues" > report.txt

          # ESLint (only errors severity=2)
          ESLINT_ERRORS=$(jq '
            [.[].messages[]? | select(.severity==2)] | length
          ' eslint.json)

          if [ "$ESLINT_ERRORS" -gt 0 ]; then
            echo "❌ $ESLINT_ERRORS ESLint errors found" >> report.txt
          else
            echo "✅ No ESLint errors" >> report.txt
          fi

          echo "\n## 🔐 Security" >> report.txt

          CRITICAL=$(jq '.vulnerabilities | to_entries[] | select(.value.severity=="critical") | .key' audit.json | wc -l)
          HIGH=$(jq '.vulnerabilities | to_entries[] | select(.value.severity=="high") | .key' audit.json | wc -l)

          echo "🚨 Critical: $CRITICAL" >> report.txt
          echo "⚠️ High: $HIGH" >> report.txt

          if [ "$CRITICAL" -gt 0 ]; then
            echo "\nCritical packages:" >> report.txt
            jq -r '.vulnerabilities | to_entries[] | select(.value.severity=="critical") | "- " + .key' audit.json >> report.txt
          fi

          echo "\n## 🏗 Build" >> report.txt
          if [ -f build.txt ]; then
            echo "❌ Build failed" >> report.txt
          else
            echo "✅ Build successful" >> report.txt
          fi

      # 🔹 Comment (VERY CLEAN OUTPUT)
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const diff = fs.readFileSync('pr.diff', 'utf8').slice(0, 20000);
            const report = fs.readFileSync('report.txt', 'utf8');

            const body =
              "## 🔍 Changes\n" +
              "```diff\n" +
              diff +
              "\n```\n\n" +
              report;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });



